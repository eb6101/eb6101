<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

    <script type="module" src="JavaScript/gsapTest_1.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        padding: 0;
        margin: 0;
        background-color: #000;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
      }
      .section1 {
        /* background-color: #098; */
      }
      .section2 {
        /* background-color: #123; */
      }

      .sec1_box {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100%;
        height: 100vh;
      }

      .sec2_box {
        position: absolute;
        top: 0%;
        left: 50%;
        transform: translate(-50%, 0%);
        width: 100%;
        height: 100vh;
      }

      .sec1_box > img,
      .sec2_box > img {
        width: 100%;
        height: 100%;
        transition: all 2s;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="container section1 ttt">
      <div class="sec1_box">
        <h1 class="text-white text-3xl font-bold underline">Hello world!</h1>
        <img src="./images/隆基智能成立.jpg" class="img1" />
      </div>
    </div>
    <div class="container section2">
      <div class="sec2_box">
        <img src="./images/兰大合作.jpg" class="img2" />
      </div>
    </div>
  </body>

  <script>
    ScrollTrigger.create({
      trigger: ".section1",
      start: "top top",
      end: "+=1000",
      scrub: true,
      markers: true,
      animation: gsap
        .timeline()
        .fromTo(
          ".sec1_box",
          {
            scale: 1,
            opacity: 1,
          },
          { scale: 0.5, opacity: 0 }
        )
        .fromTo(
          ".sec2_box",
          { width: "30%", height: "30vh" },
          { width: "100%", height: "100vh" },
          "<"
        ),
    });
  </script>
</html>
